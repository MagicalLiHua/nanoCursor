[project]
name = "nanocursor"
version = "3.0.0"
description = "A terminal coding agent with a traceable real-repository evaluation workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "LiHua" }]
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
]

[project.scripts]
nanocursor = "nanocursor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["nanocursor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
markers = [
    "timeout(seconds): documents an expected upper bound for a test",
]
