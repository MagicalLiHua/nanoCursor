<svg xmlns="http://www.w3.org/2000/svg" width="930" height="500" viewBox="0 0 930 500">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
.title { font-size: 24px; font-weight: 700; } .subtitle { font-size: 13px; fill: #737373; }
.label { font-size: 13px; } .small { font-size: 11px; fill: #737373; } .value { font-size: 12px; font-weight: 650; }
.axis { stroke: #cbd5e1; stroke-width: 1; } .grid { stroke: #e2e8f0; stroke-width: 1; }
</style>
<text x="45" y="42" class="title">Execution intensity</text>
<text x="45" y="66" class="subtitle">Normalized ratios show what happened inside each turn, not just total run cost.</text>
<text x="45" y="138" class="label">Tokens / turn</text>
<rect x="220" y="120" width="473.4" height="24" rx="4" fill="#2563eb"/>
<text x="703.4" y="137" class="value">1,177.85</text>
<text x="205" y="137" text-anchor="end" class="small">nanoCursor</text>
<rect x="220" y="154" width="508.9" height="24" rx="4" fill="#f97316"/>
<text x="738.9" y="171" class="value">1,266.29</text>
<text x="205" y="171" text-anchor="end" class="small">Pi</text>
<text x="45" y="243" class="label">Tool calls / turn</text>
<rect x="220" y="225" width="508.4" height="24" rx="4" fill="#2563eb"/>
<text x="738.4" y="242" class="value">1.30</text>
<text x="205" y="242" text-anchor="end" class="small">nanoCursor</text>
<rect x="220" y="259" width="508.9" height="24" rx="4" fill="#f97316"/>
<text x="738.9" y="276" class="value">1.30</text>
<text x="205" y="276" text-anchor="end" class="small">Pi</text>
<text x="45" y="348" class="label">Seconds / turn</text>
<rect x="220" y="330" width="458.4" height="24" rx="4" fill="#2563eb"/>
<text x="688.4" y="347" class="value">4.35</text>
<text x="205" y="347" text-anchor="end" class="small">nanoCursor</text>
<rect x="220" y="364" width="508.9" height="24" rx="4" fill="#f97316"/>
<text x="738.9" y="381" class="value">4.83</text>
<text x="205" y="381" text-anchor="end" class="small">Pi</text></svg>
