name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest -q

  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation/agent-eval-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: evaluation/agent-eval-lab/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  public-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: python evaluation/analysis/build_public_artifacts.py --output-dir evaluation/results
