syntax = "proto3";
package nanocursor.executor;
option go_package = "nanocursor/go-services/executor/proto";

service ExecutorService {
  rpc PreviewTool(PreviewRequest) returns (Decision);
  rpc ExecuteTool(ExecuteRequest) returns (ToolRun);
  rpc GetToolRun(GetToolRunRequest) returns (ToolRun);
  rpc StreamToolRunEvents(StreamEventsRequest) returns (stream ToolEvent);
  rpc CancelToolRun(CancelRequest) returns (CancelResult);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message PreviewRequest {
  string command = 1;
  string cwd = 2;
  string workspace_dir = 3;
  string permission_level = 4;
  bool requires_approval = 5;
  string approval_id = 6;
  string approval_token = 7;
}

message Decision {
  bool allowed = 1;
  string permission_level = 2;
  bool requires_approval = 3;
  string error_code = 4;
  string message = 5;
  repeated string reasons = 6;
  string workspace_dir = 7;
  string cwd = 8;
}

message ExecuteRequest {
  string command = 1;
  string cwd = 2;
  string workspace_dir = 3;
  int32 timeout_ms = 4;
  string run_id = 5;
  string approval_token = 6;
  string permission_level = 7;
  bool requires_approval = 8;
  string approval_id = 9;
  int32 max_stdout_chars = 10;
  int32 max_stderr_chars = 11;
}

message ToolRun {
  string id = 1;
  string status = 2;
  string command = 3;
  string cwd = 4;
  int32 exit_code = 5;
  string stdout = 6;
  string stderr = 7;
  int64 duration_ms = 8;
  bool timed_out = 9;
  string error_code = 10;
  string message = 11;
  bool stdout_truncated = 12;
  bool stderr_truncated = 13;
}

message GetToolRunRequest {
  string id = 1;
}

message StreamEventsRequest {
  string run_id = 1;
  int32 after_cursor = 2;
}

message ToolEvent {
  int32 seq = 1;
  string type = 2;
  int64 timestamp = 3;
  string run_id = 4;
  string data = 5;
}

message CancelRequest {
  string run_id = 1;
}

message CancelResult {
  bool success = 1;
  string message = 2;
}

message HealthRequest {}
message HealthResponse {
  bool ok = 1;
  string service = 2;
  string version = 3;
}
