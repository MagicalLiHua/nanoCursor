syntax = "proto3";
package nanocursor.indexer;
option go_package = "nanocursor/go-indexer/internal/server";

service Indexer {
  rpc BuildIndex(BuildIndexRequest) returns (BuildIndexResponse);
  rpc UpdateIndex(UpdateIndexRequest) returns (UpdateIndexResponse);
  rpc SearchSymbol(SearchSymbolRequest) returns (SearchSymbolResponse);
  rpc SearchDependents(SearchDependentsRequest) returns (SearchDependentsResponse);
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
  rpc GetRouteSummary(GetRouteSummaryRequest) returns (GetRouteSummaryResponse);
  rpc SearchCallers(SearchCallersRequest) returns (SearchCallersResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message FileEntry {
  string path = 1;
  string role = 2;
  string language = 3;
  repeated Symbol symbols = 4;
  repeated string imports = 5;
  double mtime = 6;
  int64 size = 7;
  int32 loc = 8;
  repeated Route routes = 9;
  map<string, StringList> call_graph = 10;
}

message Symbol {
  string name = 1;
  string type = 2;
  int32 lineno = 3;
}

message Route {
  string method = 1;
  string path = 2;
  string handler = 3;
  int32 lineno = 4;
}

message StringList {
  repeated string values = 1;
}

message BuildIndexRequest {
  string workspace = 1;
  bool force = 2;
}

message BuildIndexResponse {
  bool built = 1;
  int32 file_count = 2;
}

message UpdateIndexRequest {
  string workspace = 1;
}

message UpdateIndexResponse {
  int32 updated_count = 1;
  int32 removed_count = 2;
}

message SearchSymbolRequest {
  string query = 1;
}

message SearchSymbolResponse {
  repeated SymbolResult results = 1;
}

message SymbolResult {
  string file = 1;
  string symbol_name = 2;
  string symbol_type = 3;
  int32 lineno = 4;
}

message SearchDependentsRequest {
  string module = 1;
}

message SearchDependentsResponse {
  repeated string files = 1;
}

message GetSummaryRequest {
  string workspace = 1;
}

message GetSummaryResponse {
  repeated string entry_points = 1;
  int32 source_count = 2;
  int32 test_count = 3;
  int32 config_count = 4;
  int32 total_files = 5;
  int64 total_loc = 6;
  map<string, ModuleInfo> modules = 7;
  map<string, StringList> dependency_graph = 8;
  repeated RecentFile recently_modified = 9;
  string summary_text = 10;
}

message ModuleInfo {
  string role = 1;
  repeated Symbol symbols = 2;
}

message RecentFile {
  string path = 1;
  double mtime = 2;
}

message GetRouteSummaryRequest {
  string workspace = 1;
}

message GetRouteSummaryResponse {
  repeated RouteEntry routes = 1;
}

message RouteEntry {
  string method = 1;
  string path = 2;
  string handler = 3;
  string file = 4;
  int32 lineno = 5;
}

message SearchCallersRequest {
  string function_name = 1;
}

message SearchCallersResponse {
  repeated string callers = 1;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string service = 2;
  string version = 3;
  int64 indexed_files = 4;
}
