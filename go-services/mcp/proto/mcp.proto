syntax = "proto3";
package nanocursor.mcp;
option go_package = "nanocursor/go-services/mcp/proto";

service MCPService {
  rpc ListPresets(ListPresetsRequest) returns (PresetList);
  rpc ListServers(ListServersRequest) returns (ServerList);
  rpc ProbeServer(ProbeRequest) returns (ProbeResult);
  rpc ListServerTools(ListToolsRequest) returns (ToolList);
  rpc CallTool(CallToolRequest) returns (CallResult);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ListPresetsRequest {}
message PresetList {
  repeated Preset presets = 1;
}
message Preset {
  string id = 1;
  string name = 2;
  string description = 3;
  string command = 4;
  repeated string args = 5;
  map<string, string> env = 6;
}

message ListServersRequest {}
message ServerList {
  repeated Server servers = 1;
}
message Server {
  string id = 1;
  string name = 2;
  string command = 3;
  repeated string args = 4;
  map<string, string> env = 5;
  string status = 6;
}

message ProbeRequest {
  string server_id = 1;
  string workspace_dir = 2;
  string command = 3;
  repeated string args = 4;
  map<string, string> env = 5;
  repeated string env_keys = 6;
}

message ProbeResult {
  string server_id = 1;
  string status = 2;
  bool ok = 3;
  string error = 4;
}

message ListToolsRequest {
  string server_id = 1;
}
message ToolList {
  repeated MCPTool tools = 1;
  string status = 2;
  bool ok = 3;
  string error = 4;
}
message MCPTool {
  string name = 1;
  string description = 2;
  string input_schema = 3;
  string permission_level = 4;
  bool requires_approval = 5;
}

message CallToolRequest {
  string server_id = 1;
  string tool_name = 2;
  string arguments = 3;
  string workspace_dir = 4;
  string permission_level = 5;
  bool requires_approval = 6;
  string approval_id = 7;
  string approval_token = 8;
  string run_id = 9;
}
message CallResult {
  string server_id = 1;
  string tool = 2;
  bool ok = 3;
  string result = 4;
  string error = 5;
  string error_code = 6;
  string permission_level = 7;
  bool requires_approval = 8;
}

message HealthRequest {}
message HealthResponse {
  bool ok = 1;
  string service = 2;
  string version = 3;
}
